name: Build LOKA PhoneFinder APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Bundle the registry
        run: |
          mkdir -p app/src/main/assets
          cp registry/providers.json app/src/main/assets/providers.json
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LOKA-PhoneFinder.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LOKA-PhoneFinder.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Bundle the registry
        run: |
          mkdir -p app/src/main/assets
          cp registry/providers.json app/src/main/assets/providers.json
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.loka.phonefinder/files/screenshots/. screenshots/ || true
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            screenshots
            app/build/reports/androidTests
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: actions/download-artifact@v4
        with:
          name: emulator-results
          path: emu
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pf-${{ github.run_number }}
          name: Loka PhoneFinder build ${{ github.run_number }}
          body: Passed unit tests, lint and an emulator smoke test (see the workflow run). Debug-signed with a fresh key, so uninstall older builds first.
          files: |
            LOKA-PhoneFinder.apk
            emu/screenshots/*.png
